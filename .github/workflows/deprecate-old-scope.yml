name: Deprecate old npm scope

# This package moved from @flashylabs/wdk-policy-guard to
# @flashyfinancial/wdk-policy-guard. `npm deprecate` on the old name points
# anyone who still has it pinned at the new one, but it is a one-way,
# irreversible write against the public registry — it is never run by a
# commit, a push, or a schedule, only by a human choosing `Run workflow` in
# the Actions tab, once, after the new scope has a real release on it.
#
# It reuses this repository's existing npm publish credential rather than a
# second secret, and it verifies the token can act on the OLD scope before
# writing anything, the same "prove it before doing anything else" shape
# publish.yml already uses.

on:
  workflow_dispatch:
    inputs:
      range:
        description: 'The semver range on the OLD scope to deprecate (e.g. "*" for every published version)'
        required: true
        default: '*'
      message:
        description: 'The deprecation message npm shows to anyone who installs it'
        required: true
        default: 'This package moved to @flashyfinancial/wdk-policy-guard — update your dependency.'

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify the npm token can act on the old scope before doing anything else
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_FLASHYOS_CI || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::No npm token found. Add one with publish rights on the old @flashylabs scope as a repo secret named NPM_TOKEN_FLASHYOS_CI or NPM_TOKEN."
            exit 1
          fi
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::The npm token is set but not valid for this scope — npm said: ${WHO}."
            exit 1
          fi
          echo "Authenticated to npm as ${WHO}"

      - name: Deprecate @flashylabs/wdk-policy-guard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_FLASHYOS_CI || secrets.NPM_TOKEN }}
          RANGE: ${{ github.event.inputs.range }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: npm deprecate "@flashylabs/wdk-policy-guard@${RANGE}" "${MESSAGE}"
