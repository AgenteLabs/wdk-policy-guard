name: Scorecard supply-chain security

# OpenSSF Scorecard — an automated, standardized check of the supply-chain
# practices this file and its siblings implement by hand: pinned dependencies,
# branch protection, static analysis, vulnerability disclosure, dangerous
# workflow patterns. Results upload as a SARIF to this repo's own code
# scanning tab (Security -> Code scanning).
#
# publish_results is deliberately false: publishing to the public Scorecard
# API needs a Sigstore/Fulcio signature over an OIDC token this runner's
# environment does not currently hand back as valid JSON (an org-level
# Actions/OIDC permission, not something a workflow file can fix) -- proven
# by a real failed run, not assumed. Flip it to true once that is resolved;
# see CONTRIBUTING.md.

on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6' # every Saturday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
